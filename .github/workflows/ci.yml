name: ci

on:
  push:
    branches: [main, mini, "mini-*"]
  pull_request:
    branches: [main, mini]

jobs:
  test:
    name: vet + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -count=1 ./...

      - name: build
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/mini .

      - name: smoke
        run: /tmp/mini help && /tmp/mini tools | head -5
